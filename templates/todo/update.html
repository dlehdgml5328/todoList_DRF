{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container">
    <h2>Create a New Todo</h2>

    <div>
        <label for="name">Name:</label>
        <input type="text"name="name"id="name">
    <div>
        <label for="description">Description:</label>
        <textarea type=""name="description"id="description"></textarea>
    </div>
    <div>
        <label for="complete">Complete</label>
        <input type="checkbox"name="complete"id="complete">
    </div>
    <div>
        <label for="exp">Experience Points:</label>
        <input type="number"name="exp"id="exp" min="0">
    </div>
    <button type= "submit" id="todoUpdate">Create</button>
</div>

<script>
//--1.초기화---
document.addEventListener("DOMContentLoaded", init);
//---2. init--
function init(){
    //URL에서 pk(기본키)추출-> /todo/update/5/-->5
    const pk =getTodoId();//pk를 가져오는 함수->변수저장
    loadTodoIntoForm(pk);
    bindUpdateBtn(pk);
}
//---3.URL에서 pk 추출---
function getTodoId(){

    return window.location.pathname.split('/').filter(Boolean).pop();//5
    //todo/update/5/ ->["todo",/"update",/"5"]->"5"

}
function loadTodoIntoForm(pk){

    axiosInstance
    .get(`/todo/api/retrieve/${pk}/`) //엔드포인트:  url주소 호출
    .then(res=>{
        populateForm(res.data);
        console.log("res??",res); // 전체 응답 데이터
        console.log("data??",res.data);//받아온 데이터를 form에 채우고싶어서
    })
    .catch(err => console.error('리스트 로드 실패', err));
}
//5서버 데이터 명세서--
function populateForm(data){
    document.getElementById("name").value=data.name;
    document.getElementById("description").value=data.description;
    document.getElementById("complete").checked=data.complete;
    document.getElementById("exp").value=data.exp;
}
/*
name :"공부하기",
...

//---6. bindUpdateBtn & click ---
*/
function bindUpdateBtn(pk){
    const btn =document.getElementById("todoUpdate");
    if(!btn)return;
    btn.addEventListener('click',()=>handleUpdate(pk));
}

//--7.서버에 업데이트 요청 처리---
function handleUpdate(pk){
    const payload = {
    name:document.getElementById('name').value,
    description:document.getElementById('description').value,
    complete:document.getElementById('complete').checked,
    exp:Number(document.getElementById('exp').value),
    }
    axiosInstance
    .patch(`/todo/api/update/${pk}/`,payload) //엔드포인트:  url주소 호출
    .then(()=> redirectToDetail(pk))
    .catch(err =>{

        console.error('리스트 로드 실패', err);
        alert('Todo 수정에 실패했습니다.');
    });
}

function redirectToDetail(pk){
    window.location.href = `/todo/detail/${pk}/`;
}
</script>


{% endblock %}
